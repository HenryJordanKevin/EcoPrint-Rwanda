<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EcoPrint</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="Logo.png">
<style>
:root {
    --green: #2D5A27;
    --accent: #F4A261;
    --white: #ffffff;
    --text: #1a1a1a;
}

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Open Sans', sans-serif;
    background: linear-gradient(135deg, #eef5ee, #f9fbf9);
    color: var(--text);
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

/* NAV */
nav {
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(10px);
    background:#ffffff;
    border-bottom: 4px solid #2D5A27;
}

.nav-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
}

.logo img {
    height: 50px;
}

.nav-links a {
    margin-left: 30px;
    text-decoration: none;
    font-weight: 600;
    color: var(--text);
}

/* HERO */
.hero {
    height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
                url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1400');
    background-size: cover;
}

.hero h1 {
    font-family: Montserrat;
    font-size: 2.5rem;
    text-decoration: underline;
}

/* CONTACT */
.contact {
    padding: 120px 0 80px;
}

.contact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
}

/* CARD */
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* BUTTON */
.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    background: var(--green);
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
}

.btn:hover {
    background: #23471f;
}

/* FOOTER */
footer {
    background: var(--green);
    color: white;
    text-align: center;
    padding: 30px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="container nav-content">
        <div class="logo"><img src="Logo.png" alt="EcoPrint Logo"></div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#About">About</a>
            <a href="#Process">Process</a>
            <a href="Contact.html">Contact</a>
        </div>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>Contact Us</h1>
</section>

<!-- CONTACT -->
<section class="contact">
    <div class="container">
        <div class="contact-grid">

            <!-- EMAIL -->
            <div class="card">
                <h3>Email</h3>
                <p>ecoprint@gmail.com</p>
                <a href="mailto:ecoprint@gmail.com" class="btn">Send Email</a>
            </div>

            <!-- PHONE -->
            <div class="card">
                <h3>Phone</h3>
                <p>+250 780 329 373</p>
                <a href="tel:+250780329373" class="btn">Call Now</a>
            </div>

            <!-- WHATSAPP -->
            <div class="card">
                <h3>WhatsApp</h3>
                <p>Chat with us instantly</p>
                <a href="https://wa.me/250780329373" class="btn">Open WhatsApp</a>
            </div>

            <!-- LOCATION -->
            <div class="card">
                <h3>Location</h3>
                <p>Kigali, Rwanda</p>
            </div>

        </div>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 EcoPrint Rwanda — Printing a Greener Tomorrow</p>
</footer>

</body>
</html>
